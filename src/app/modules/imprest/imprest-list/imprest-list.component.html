<div class="p-6">

  <!-- TITLE -->
  <h1 class="text-3xl font-bold mb-6">

    <span *ngIf="isAdmin">
      All Employee Imprests
    </span>

    <span *ngIf="!isAdmin">
      My Imprests
    </span>

  </h1>

  <!-- TABLE -->
  <div class="bg-white shadow rounded-lg overflow-hidden">

    <table class="w-full">

      <!-- HEADER -->
      <thead class="bg-gray-900 text-white">

        <tr>

          <th class="p-4 text-left">Employee</th>

          <th class="p-4 text-left">Amount</th>

          <th class="p-4 text-left">Purpose</th>

          <th class="p-4 text-left">Date</th>

          <th class="p-4 text-left">Status</th>

          <!-- ADMIN ONLY -->
          <th *ngIf="isAdmin"
              class="p-4 text-left">
            Actions
          </th>

        </tr>

      </thead>

      <!-- BODY -->
      <tbody>

        <tr *ngFor="let imp of imprests"
            class="border-b hover:bg-gray-50">

          <td class="p-4">
            {{ imp.employeeName }}
          </td>

          <td class="p-4">
            KES {{ imp.amount }}
          </td>

          <td class="p-4">
            {{ imp.purpose }}
          </td>

          <td class="p-4">
            {{ imp.date | date }}
          </td>

          <td class="p-4">

            <span
              class="px-3 py-1 rounded-full text-white text-sm"
              [ngClass]="{
                'bg-yellow-500': imp.status === 'Pending',
                'bg-green-600': imp.status === 'Approved',
                'bg-red-600': imp.status === 'Rejected'
              }"
            >

              {{ imp.status }}

            </span>

          </td>

          <!-- ADMIN ACTIONS -->
          <td *ngIf="isAdmin"
    class="p-4">

  <!-- ONLY SHOW ACTIONS FOR PENDING -->
  <div *ngIf="imp.status === 'Pending'"
       class="flex gap-2">

    <button
      class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700"
      (click)="approve(imp.id)"
    >
      Approve
    </button>

    <button
      class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700"
      (click)="reject(imp.id)"
    >
      Reject
    </button>

  </div>

  <!-- FINALIZED STATUS -->
  <span *ngIf="imp.status !== 'Pending'"
        class="text-gray-500 text-sm italic">

    Decision Finalized

  </span>

</td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
