<div class="p-6">
  <button (click)="goBack()"
          class="text-gray-500 hover:text-gray-700 mb-4 flex items-center">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Back to Dashboard
  </button>

  <h2 class="text-2xl font-bold text-gray-800 mb-6">Total Imprests</h2>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
     <button (click)="openModal('request')"
             class="flex flex-col items-center justify-center p-6 rounded-lg border-2 border-blue-500 text-blue-600 hover:bg-blue-50 transition">
       <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
       <span class="text-sm font-semibold">Request Imprest</span>
     </button>

     <button (click)="openModal('pending')"
             class="flex flex-col items-center justify-center p-6 rounded-lg border-2 border-yellow-500 text-yellow-600 hover:bg-yellow-50 transition">
       <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
       <span class="text-sm font-semibold">Pending ({{ pendingImprests.length }})</span>
     </button>

     <button (click)="openModal('approved')"
             class="flex flex-col items-center justify-center p-6 rounded-lg border-2 border-green-500 text-green-600 hover:bg-green-50 transition">
       <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
       <span class="text-sm font-semibold">Approved ({{ approvedImprests.length }})</span>
     </button>

     <button (click)="openModal('rejected')"
             class="flex flex-col items-center justify-center p-6 rounded-lg border-2 border-red-500 text-red-600 hover:bg-red-50 transition">
       <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
       <span class="text-sm font-semibold">Rejected ({{ rejectedImprests.length }})</span>
     </button>

     <button (click)="openModal('withdraw')"
             class="flex flex-col items-center justify-center p-6 rounded-lg border-2 border-purple-500 text-purple-600 hover:bg-purple-50 transition">
        <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-sm font-semibold">Withdraw Imprest</span>
      </button>
   </div>

   <!-- Popup Modal -->
   <app-imprest-modal
     *ngIf="showModal"
     [type]="modalType"
     (close)="closeModal()"
     (save)="closeModal()"
   ></app-imprest-modal>
 </div>
