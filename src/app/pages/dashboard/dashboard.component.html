<div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-4">

  <mat-card class="p-6 bg-red-100">
    <h3 class="text-xl font-bold">Total Imprests</h3>
    <p>{{ total }}</p>
  </mat-card>

  <mat-card class="p-4 text-green-600">
    <h3>Approved</h3>
    <p>{{ approved }}</p>
  </mat-card>

  <mat-card class="p-4 text-yellow-600">
    <h3>Pending</h3>
    <p>{{ pending }}</p>
  </mat-card>

  <mat-card class="p-4 text-red-600">
    <h3>Rejected</h3>
    <p>{{ rejected }}</p>
  </mat-card>

</div>
